#
# refind.conf
# Configuration file for the rEFInd boot menu
#

# theme
include themes/catppuccin/frappe.conf

timeout 20

scanfor manual,internal

# to use %v in refind_linux.conf
extra_kernel_version_strings linux-zen,linux

menuentry "Arch Linux" {
    icon     /EFI/refind/icons/os_arch.png
    # label
    volume   proboot
    # these are relative to the volume! (actually /boot/vmlinuz...)
    loader   /vmlinuz-linux-zen
    initrd   /initramfs-linux-zen.img
    # scsi_mod.use_blk_mq=1 needed for scsi and sata drives now for bfq
    # fine to keep it, though I'm using kyber though now:
    # ../../../../etc/udev/rules.d/60-schedulers.rules
    # elevator=bfq does not work anymore; need udev rule

    # https://wiki.archlinux.org/index.php/Silent_boot
    # https://wiki.archlinux.org/title/Dm-crypt/Specialties#Discard/TRIM_support_for_solid_state_drives_(SSD)
    # https://asalor.blogspot.com/2011/08/trim-dm-crypt-problems.html
    # "If plausible deniability is not required, TRIM can be used for its performance gains, provided that the security dangers described at the top of this section are not of concern."

	# don't think disabling psr helped noticeably, but I will leave off as commonly a problem without significant battery life gains
    options  "cryptdevice=LABEL=prolinux:prolinux:allow-discards resume=/dev/prolinux_group/swap root=/dev/prolinux_group/root rw rootflags=noatime scsi_mod.use_blk_mq=y quiet nosplash i915.enable_psr=0"

    submenuentry "Verbose boot" {
        options "cryptdevice=LABEL=prolinux:prolinux:allow-discards resume=/dev/prolinux_group/swap root=/dev/prolinux_group/root rw rootflags=noatime scsi_mod.use_blk_mq=y i915.enable_psr=0"
    }

    submenuentry "Boot using fallback zen initramfs" {
        initrd /initramfs-linux-zen-fallback.img
    }

    submenuentry "Boot using normal linux" {
        loader /vmlinuz-linux
        initrd /initramfs-linux.img
    }
    submenuentry "Boot using fallback normal linux" {
        loader /vmlinuz-linux
        initrd /initramfs-linux-fallback.img
    }

    # prefer using labels but have this as well
    submenuentry "Boot using systemd initramfs" {
        initrd /initramfs-linux-custom-systemd.img
        options  "rd.luks.name=631abab2-feb9-4564-9f3d-3c8544246b4d=prolinux rd.luks.options=discard resume=/dev/prolinux_group/swap root=/dev/prolinux_group/root rw rootflags=noatime scsi_mod.use_blk_mq=y quiet nosplash i915.enable_psr=0"
    }
    submenuentry "Boot using fallback systemd initramfs" {
        initrd /initramfs-linux-custom-systemd-fallback.img
        options  "rd.luks.name=631abab2-feb9-4564-9f3d-3c8544246b4d=prolinux rd.luks.options=discard resume=/dev/prolinux_group/swap root=/dev/prolinux_group/root rw rootflags=noatime scsi_mod.use_blk_mq=y quiet nosplash i915.enable_psr=0"
    }
    submenuentry "Boot using systemd linux zen initramfs" {
        initrd /initramfs-linux-zen-custom-systemd.img
        options  "rd.luks.name=631abab2-feb9-4564-9f3d-3c8544246b4d=prolinux rd.luks.options=discard resume=/dev/prolinux_group/swap root=/dev/prolinux_group/root rw rootflags=noatime scsi_mod.use_blk_mq=y quiet nosplash i915.enable_psr=0"
    }
    submenuentry "Boot using fallback systemd linux zen initramfs" {
        initrd /initramfs-linux-zen-custom-systemd-fallback.img
        options  "rd.luks.name=631abab2-feb9-4564-9f3d-3c8544246b4d=prolinux rd.luks.options=discard resume=/dev/prolinux_group/swap root=/dev/prolinux_group/root rw rootflags=noatime scsi_mod.use_blk_mq=y quiet nosplash i915.enable_psr=0"
    }
}
