# this shows up as a separate entry/icon in refind
# I normally boot from the manually defined entry in refind.conf instead but am keeping
# this as backup (has worked in some cases where the refind.conf entry did not)
# refind-install will generate this file if it does not exists; otherwise it will not overwrite it
"Boot with standard options"  "cryptdevice=LABEL=prolinux:prolinux:allow-discards resume=/dev/prolinux_group/swap root=/dev/prolinux_group/root rw rootflags=noatime scsi_mod.use_blk_mq=y quiet nosplash i915.enable_psr=0"
"Boot to single-user mode"    "cryptdevice=LABEL=prolinux:prolinux:allow-discards resume=/dev/prolinux_group/swap root=/dev/prolinux_group/root rw rootflags=noatime scsi_mod.use_blk_mq=y quiet nosplash single"
"Boot loud"                   "cryptdevice=LABEL=prolinux:prolinux:allow-discards resume=/dev/prolinux_group/swap root=/dev/prolinux_group/root rw rootflags=noatime scsi_mod.use_blk_mq=y nosplash"
"Boot with systemd initramfs" "rd.luks.name=631abab2-feb9-4564-9f3d-3c8544246b4d=prolinux rd.luks.options=discard resume=/dev/prolinux_group/swap root=/dev/prolinux_group/root rw rootflags=noatime scsi_mod.use_blk_mq=y quiet nosplash"
"(OLD) Boot with standard options"  "cryptdevice=LABEL=cryptlinux:cryptlinux:allow-discards resume=/dev/cryptlinux_group/swap root=/dev/cryptlinux_group/root rw rootflags=noatime scsi_mod.use_blk_mq=y quiet vga=current nosplash"
"(OLD) Boot to single-user mode"    "cryptdevice=LABEL=cryptlinux:cryptlinux:allow-discards resume=/dev/cryptlinux_group/swap root=/dev/cryptlinux_group/root rw rootflags=noatime scsi_mod.use_blk_mq=y quiet vga=current nosplash single"
