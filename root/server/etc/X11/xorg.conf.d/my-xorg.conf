# intel config from default will break server (no intel graphics)

# * Screen Blank Time
# increase blank time
Section "ServerLayout"
    Identifier "Configure DPMS"
    Option "BlankTime"   "15"
    Option "StandbyTime" "0"
    Option "SuspendTime" "30"
    Option "OffTime"     "0"
EndSection

# * Disable Mouse Acceleration
Section "InputClass"
    Identifier "Disable Acceleration"
    MatchIsPointer "yes"
    Option "AccelerationProfile" "-1"
    Option "AccelerationScheme" "none"
    Option "AccelSpeed" "-1"
EndSection
