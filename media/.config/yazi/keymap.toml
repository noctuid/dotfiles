# default config:
# https://github.com/sxyazi/yazi/blob/shipped/yazi-config/preset/keymap-default.toml

# Issues:
# - shell history https://github.com/sxyazi/yazi/issues/873
# - does not pass files in sort order

# As needed
# needs yazi-git, which doesn't build for me currently:
# https://github.com/DreamMaoMao/keyjump.yazi
# default + mtime + user/group is fine for now
# https://github.com/imsi32/yatline.yazi
# https://github.com/hunkyburrito/xdg-desktop-portal-termfilechooser?tab=readme-ov-file#installation
# https://github.com/TD-Sky/sudo.yazi
# if want to copy file (contents) to clipboard
# https://github.com/orhnk/system-clipboard.yazi
# out of date:
# https://github.com/grappas/wl-clipboard.yazi
# don't currently need interactive rg:
# https://gitee.com/DreamMaoMao/fg.yazi

# * Basic Navigation
[[mgr.prepend_keymap]]
on = "q"
run = "close"

[[mgr.prepend_keymap]]
on = "e"
run = "arrow -1"

[[mgr.prepend_keymap]]
on = "n"
run = "arrow 1"

[[mgr.prepend_keymap]]
on   = [ "N" ]
run  = "plugin first-non-directory"
desc = "Jumps to the first file"

[[mgr.prepend_keymap]]
on   = "i"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = "l"
run = "back"

[[mgr.prepend_keymap]]
on   = ["t", "p"]
run  = "plugin fzf"

[[mgr.prepend_keymap]]
on   = ["t", "f"]
run  = "plugin zoxide"

[[mgr.prepend_keymap]]
on   = "f"
run  = "filter --smart"

# unfortunately doesn't work very well (keeps previous letters on jump)
[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"

# [[manager.prepend_keymap]]
# on   = "F"
# run  = "plugin jump-to-char"
# desc = "Jump to char"

# [[manager.prepend_keymap]]
# on   = "F"
# run  = "plugin keyjump"

# * Quickmarks
[[mgr.prepend_keymap]]
on = ["g", "/"]
run = "cd /"

[[mgr.prepend_keymap]]
on = ["g", "b"]
run = "cd /bin"

[[mgr.prepend_keymap]]
on = ["g", "e"]
run = "cd /etc"

[[mgr.prepend_keymap]]
on = ["g", "m"]
run = "cd /media"

[[mgr.prepend_keymap]]
on = ["g", "M"]
run = "cd /mnt"

[[mgr.prepend_keymap]]
on = ["g", "o"]
run = "cd /opt"

[[mgr.prepend_keymap]]
on = ["g", "t"]
run = "cd /tmp"

[[mgr.prepend_keymap]]
on = ["g", "u"]
run = "cd /usr"

[[mgr.prepend_keymap]]
on = ["g", "v"]
run = "cd /var"

[[mgr.prepend_keymap]]
on = ["'", "a"]
run = "cd ~/ag-sys"

[[mgr.prepend_keymap]]
on = ["'", "b"]
run = "cd ~/dotfiles/scripts/bin"

[[mgr.prepend_keymap]]
on = ["'", "c"]
run = "cd ~/src"

[[mgr.prepend_keymap]]
on = ["'", "d"]
run = "cd ~/database"

[[mgr.prepend_keymap]]
on = ["'", "e"]
run = "cd ~/.emacs.d"

[[mgr.prepend_keymap]]
on = ["'", "E"]
run = "cd ~/ag-sys/else"

[[mgr.prepend_keymap]]
on = ["'", "f"]
run = "cd ~/dotfiles"

[[mgr.prepend_keymap]]
on = ["'", "h"]
run = "cd ~/database/pictures/help-and-guides"

[[mgr.prepend_keymap]]
on = ["'", "l"]
run = "cd ~/database/library"

[[mgr.prepend_keymap]]
on = ["'", "m"]
run = "cd ~/move"

[[mgr.prepend_keymap]]
on = ["'", "s"]
run = "cd ~/move/screenshots"

[[mgr.prepend_keymap]]
on = ["'", "S"]
run = "cd ~/move/Screenshots"

[[mgr.prepend_keymap]]
on = ["'", "w"]
run = "cd ~/wallpaper"

# * Marking/Yanking/Moving/Deleting
[[mgr.prepend_keymap]]
on = ","
run = ["toggle", "arrow 1"]

[[mgr.prepend_keymap]]
on = "v"
run = "toggle_all"

[[mgr.prepend_keymap]]
on = ["u", "m"]
run = "toggle --state=off"

[[mgr.prepend_keymap]]
on = ["u", "v"]
run = "toggle_all --state=off"

[[mgr.prepend_keymap]]
on = ["u", "y"]
run = "unyank"

[[mgr.prepend_keymap]]
on = "V"
run = "visual_mode"

[[mgr.prepend_keymap]]
on = ["y", "y"]
run = "yank"

[[mgr.prepend_keymap]]
on = ["y", "p"]
run = "copy path"

[[mgr.prepend_keymap]]
on = ["y", "d"]
run = "copy dirname"

[[mgr.prepend_keymap]]
on = ["y", "n"]
run = "copy filename"

[[mgr.prepend_keymap]]
on = ["y", "."]
run = "copy name_without_ext"

# or just x
[[mgr.prepend_keymap]]
on = ["d", "d"]
run = "yank --cut"

[[mgr.prepend_keymap]]
on = ["d", "i"]
run = "remove"
desc = "Trash"

[[mgr.prepend_keymap]]
on   = ["u", "d"]
run  =  "plugin restore"

# don't allow real deletion
[[mgr.prepend_keymap]]
on = ["D"]
run = "noop"

[[mgr.prepend_keymap]]
on = ["p", "p"]
run = "paste"

[[mgr.prepend_keymap]]
on = ["p", "l"]
run = "link"

[[mgr.prepend_keymap]]
on = ["p", "L"]
run = "link --relative"

[[mgr.prepend_keymap]]
on = ["p", "h"]
run = "hardlink"

# * Create/Rename
[[mgr.prepend_keymap]]
on = ["c", "c"]
run = "rename --empty=stem --cursor=start"

[[mgr.prepend_keymap]]
on = "a"
run = "rename --cursor=end"

[[mgr.prepend_keymap]]
on = "I"
run = "rename --cursor=start"

[[mgr.prepend_keymap]]
on = ["c", "n"]
run = "create"
desc = "Create file OR directory"

[[mgr.prepend_keymap]]
on = ["c", "d"]
run = "create --dir"
desc = "Create directory"

# * Find
# s - file names with fd

[[mgr.prepend_keymap]]
on = "k"
run = "find_arrow"

[[mgr.prepend_keymap]]
on = "K"
run = "find_arrow --previous"

# * Tabs
# TODO don't like that tabs aren't like in ranger
# (in ranger you can open tab 8 without having 7 tabs open, and closing tabs doesn't affect tab numbers)
[[mgr.prepend_keymap]]
on = ["t", "t"]
run = "tab_create --current"

[[mgr.prepend_keymap]]
on = ["<Space>", "a"]
run = "plugin smart-switch 0"

[[mgr.prepend_keymap]]
on = ["<Space>", "r"]
run = "plugin smart-switch 1"

[[mgr.prepend_keymap]]
on = ["<Space>", "s"]
run = "plugin smart-switch 2"

[[mgr.prepend_keymap]]
on = ["<Space>", "t"]
run = "plugin smart-switch 3"

[[mgr.prepend_keymap]]
on = ["<Space>", "d"]
run = "plugin smart-switch 4"

[[mgr.prepend_keymap]]
on = ["<Space>", "h"]
run = "plugin smart-switch 5"

[[mgr.prepend_keymap]]
on = ["<Space>", "n"]
run = "plugin smart-switch 6"

[[mgr.prepend_keymap]]
on = ["<Space>", "e"]
run = "plugin smart-switch 7"

[[mgr.prepend_keymap]]
on = ["<Space>", "i"]
run = "plugin smart-switch 8"

# it only supports 9 tabs
# [[manager.prepend_keymap]]
# on = ["<Space>", "o"]
# run = "plugin smart-switch 9"

# * Sort
[[mgr.prepend_keymap]]
on = ["o", "n"]
run = "sort --reverse=no natural"

[[mgr.prepend_keymap]]
on = ["o", "N"]
run = "sort --reverse=yes natural"

[[mgr.prepend_keymap]]
on = ["o", "m"]
run = "sort --reverse=no mtime"

[[mgr.prepend_keymap]]
on = ["o", "M"]
run = "sort --reverse=yes mtime"

[[mgr.prepend_keymap]]
on = ["o", "b"]
run = "sort --reverse=no btime"

[[mgr.prepend_keymap]]
on = ["o", "B"]
run = "sort --reverse=yes btime"

[[mgr.prepend_keymap]]
on = ["o", "s"]
run = "sort --reverse=no size"

[[mgr.prepend_keymap]]
on = ["o", "S"]
run = "sort --reverse=yes size"

[[mgr.prepend_keymap]]
on = ["o", "r"]
run = "sort random"

# * Misc
# w is already tasks
# Tab is spot
# . - toggle hidden

[[mgr.prepend_keymap]]
on = ["d", "u"]
run = "plugin what-size"

# * Shell
[[mgr.prepend_keymap]]
on   = "<C-s>"
run  = 'suspend'

[[mgr.prepend_keymap]]
on   = "S"
run  = 'shell "zsh" --block'
desc = "Open shell here"

[[mgr.prepend_keymap]]
on = "<Enter>"
run = 'shell --block --interactive'

[[mgr.prepend_keymap]]
on = ["c", "w"]
run = "shell --orphan 'walset \"$0\"'"
desc = "Set wallpaper and update pywal colors"

[[mgr.prepend_keymap]]
on = ["c", "b"]
run = "shell 'bgset \"$0\"'"
desc = "Set wallpaper"

[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

[[mgr.prepend_keymap]]
on   = [ "c", "M" ]
run  = "shell 'mat2 \"$@\"'"

# sanitize permissions
[[mgr.prepend_keymap]]
on   = [ "c", "s" ]
run  = ["shell --block 'sudo chown -R \"$USER:$USER\" \"$@\"'", "shell --block 'sudo chmod -R u=rwX,go=rX \"$@\"'"]

[[mgr.prepend_keymap]]
on   = [ "c", "u" ]
run  = "shell 'upscale \"$@\"'"

[[mgr.prepend_keymap]]
on   = [ "c", "U" ]
run  = "shell 'upscale \"$@\"' 10"

[[mgr.prepend_keymap]]
on   = [ "c", "X" ]
run  = "shell 'upscale \"$@\"' 20"

[[mgr.prepend_keymap]]
on   = "O"
run  = ["copy path", "shell 'dropmpgo'"]

[[mgr.prepend_keymap]]
on = ["u", "n"]
run = 'shell "udiskie-umount \"$@\""'

[[mgr.prepend_keymap]]
on = ["u", "N"]
run = 'shell "udiskie-umount --all"'

[[mgr.prepend_keymap]]
on = ["u", "x"]
run = 'shell "unarchive \"$@\""'

[[mgr.prepend_keymap]]
on = ["t", "x"]
run = 'shell "unarchive \"$@\" && rm \"$@\""'

[[mgr.prepend_keymap]]
on = ["c", "a"]
run = "plugin ouch"
desc = "Compress with ouch"

# * Input Keybindings
[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"
